<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">

    <div style="text-align:left; margin-bottom:1.5rem;">
      <button class="back-btn" id="backBtn" onclick="goBackToDashboard()">
        ← Back to Dashboard
      </button>
    </div>

    <h2 class="page-title">Face Recognition Attendance</h2>

    <!-- Auto-fill banner for student users -->
    <div id="studentBanner" class="card" style="display:none; max-width:480px; margin:0 auto 1.5rem; text-align:center;">
      <p style="margin-bottom:0;">Marking attendance for: <strong id="studentBannerName"></strong></p>
    </div>

    <div id="noStudentsCard" class="card" style="display:none;
      max-width:360px; margin:0 auto 2rem; text-align:center;">
      <p style="margin-bottom:1rem;">No students registered yet</p>
      <button onclick="window.location.href='register.html'">
        Register Students
      </button>
    </div>

    <div class="camera-container">
      <video id="video" autoplay muted></video>
    </div>

     <div class="action-buttons">
       <button onclick="checkAndStartFaceScan()">Start Face Scan</button>
       <button onclick="recognizeFace()">Run Recognition</button>
       <button id="markAttendanceBtn" onclick="confirmAttendance()" style="display:none; background: linear-gradient(135deg, #22c55e, #10b981);">Mark Attendance</button>
     </div>
 
     <div id="attendanceStatus" class="card" style="display:none; max-width:480px; margin:1.5rem auto; text-align:center; font-weight:600; border:1px solid rgba(255,255,255,0.1);"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _supabase = supabase.createClient(
      "https://ygxrmeugswqykhxlfjkl.supabase.co",
      "sb_publishable_ZpXluIMDi4ebS-9MkIFAsA_Sr_imexZ"
    )
  </script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js"></script>
  <script src="faceRecognition.js"></script>
  <script>
    // Bug 6 Fix: Back button preserves role context via hash
    function goBackToDashboard() {
      const role = localStorage.getItem("currentRole");
      if (role) {
        window.location.href = 'index.html#' + role;
      } else {
        window.location.href = 'index.html';
      }
    }

    document.addEventListener("DOMContentLoaded", async function () {
      const teacherId = localStorage.getItem("teacherDbId");
      if (teacherId) {
        const { data } = await _supabase.from("students").select("id").eq("teacher_id", teacherId);
        if (!data || data.length === 0) {
          document.getElementById("noStudentsCard").style.display = "block";
        }
      }

      // Auto-fill student name from currentUser
      const currentUser = localStorage.getItem("currentUser");
      const currentRole = localStorage.getItem("currentRole");
      if (currentUser && currentRole === "student") {
        document.getElementById("studentBanner").style.display = "block";
        document.getElementById("studentBannerName").textContent = currentUser;
      }
    });
    
    // Part 3: Time-Slot Based Attendance Logic Overrides
    document.addEventListener("DOMContentLoaded", function () {
       let activeSlot = null; // Store the currently matching slot

       window.checkAndStartFaceScan = async function() {
          let teacherId = localStorage.getItem("teacherDbId");
          const currentRole = localStorage.getItem("currentRole");

          if (currentRole === "student") {
             const studentId = localStorage.getItem("studentDbId");
             if (studentId) {
                 const { data: stu, error: stuErr } = await _supabase.from("students").select("teacher_id").eq("id", studentId).single();
                 if (stuErr) {
                    const statusEl = document.getElementById("attendanceStatus");
                    if (statusEl) {
                       statusEl.textContent = "❌ Database Error fetching student: " + stuErr.message;
                       statusEl.style.display = "block";
                       statusEl.style.color = "#ffb347";
                    }
                    return;
                 }
                 if (stu) teacherId = stu.teacher_id;
             }
          }

          if (!teacherId) {
             const statusEl = document.getElementById("attendanceStatus");
             if (statusEl) {
                statusEl.textContent = "❌ Subject teacher profile not found. Cannot determine active class.";
                statusEl.style.display = "block";
                statusEl.style.color = "#ffb347";
             }
             return;
          }
          
          const { data: schedule, error: schedErr } = await _supabase.from("schedule").select("*").eq("teacher_id", teacherId);
          
          if (schedErr) {
             const statusEl = document.getElementById("attendanceStatus");
             if (statusEl) {
                statusEl.textContent = "❌ Database Error checking schedule: " + schedErr.message;
                statusEl.style.display = "block";
                statusEl.style.color = "#ffb347";
             }
             return;
          }
          
          if (!schedule || schedule.length === 0) {
             const proceed = confirm("No classes are scheduled. Proceed anyway? (For testing purposes)");
             if(!proceed) return;
             
             // Fake a slot for testing if they proceed
             activeSlot = { subject: "Unscheduled Class", id: "0000" };
             if(window.startFaceRecognition) window.startFaceRecognition();
             return;
          }

          const currentDayStr = new Date().toLocaleDateString('en-US', { weekday: 'long' });
          const now = new Date();
          const currentTimeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

          activeSlot = schedule.find(slot => {
             const st = slot.start_time ? slot.start_time.substring(0, 5) : "00:00";
             const et = slot.end_time ? slot.end_time.substring(0, 5) : "23:59";
             return slot.day === currentDayStr && currentTimeStr >= st && currentTimeStr <= et;
          });

          if (!activeSlot) {
             const statusEl = document.getElementById("attendanceStatus");
             if(statusEl) {
                statusEl.textContent = "❌ No active class right now. Attendance can only be marked during scheduled class hours.";
                statusEl.style.display = "block";
                statusEl.style.color = "#ffb347";
                statusEl.style.background = "rgba(255,179,71,0.08)";
                statusEl.style.borderColor = "rgba(255,179,71,0.2)";
             }
             return; // Block execution
          }

          // Active class found, proceed with tracking
          if(window.startFaceRecognition) {
             window.startFaceRecognition();
             const statusEl = document.getElementById("attendanceStatus");
             if(statusEl) {
                statusEl.textContent = `⏳ Loading models... Active class: ${activeSlot.subject}`;
             }
          }
       };

       window.confirmAttendance = async function() {
          // Temporarily override to inject subject and slotId
          if (!matchedStudent) return; // matchedStudent is global from faceRecognition.js
          
          const teacherId = localStorage.getItem("teacherDbId");
          const record = {
            student_name: matchedStudent.name,
            teacher_id: teacherId,
            marked_at: new Date().toISOString(),
            subject: activeSlot ? activeSlot.subject : "—",
            slot_id: activeSlot ? activeSlot.id : null
          };

          const { error } = await _supabase.from("attendance").insert(record);
          
          const statusEl = document.getElementById("attendanceStatus");
          if(error) {
             if(statusEl) {
                 statusEl.textContent = `❌ Failed to mark attendance: ${error.message}`;
                 statusEl.style.display = "block";
                 statusEl.style.color = "#ffb347";
                 statusEl.style.background = "rgba(255,179,71,0.08)";
                 statusEl.style.borderColor = "rgba(255,179,71,0.2)";
             }
          } else {
             if(statusEl) {
                 statusEl.textContent = `✅ Attendance marked for ${matchedStudent.name} (${record.subject})`;
                 statusEl.style.display = "block";
                 statusEl.style.color = "#22c55e";
                 statusEl.style.background = "rgba(34,197,94,0.08)";
                 statusEl.style.borderColor = "rgba(34,197,94,0.2)";
             }
             const btn = document.getElementById("markAttendanceBtn");
             if (btn) btn.style.display = "none";
             matchedStudent = null;
          }
       };
    });
  </script>
  <script src="mist.js"></script>
</body>
</html>
