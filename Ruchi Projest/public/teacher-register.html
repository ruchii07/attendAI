<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Decorative Background Blobs -->
  <div style="position:fixed;top:-200px;left:-200px;width:600px;
    height:600px;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(192,193,255,0.06) 0%,transparent 70%);"></div>
  
  <div class="register-page">
    <div class="form-container" style="max-width: 500px;">
      <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back to Roles
      </button>
      <h2>Teacher Sign Up</h2>
      <p style="margin-bottom:1.5rem; color:rgba(194,198,214,0.6); font-size:0.9rem;">Create your account to manage students and attendance.</p>
      
      <input type="text" id="teacherName" placeholder="Full Name">
      <input type="password" id="teacherPassword" placeholder="Create Password">
      <input type="password" id="accessCode" placeholder="School Access Code (Required)">
      
      <button onclick="saveTeacher()" id="registerBtn">Create Account</button>
      
      <div id="statusMsg" style="display:none; padding:0.75rem 1rem; border-radius:8px; margin-top:1rem; font-size:0.9rem; text-align:center;"></div>
      
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script>
        const _supabase = supabase.createClient(
          "https://ygxrmeugswqykhxlfjkl.supabase.co",
          "sb_publishable_ZpXluIMDi4ebS-9MkIFAsA_Sr_imexZ"
        )
      </script>
      <script>
        async function saveTeacher() {
          const name = document.getElementById("teacherName").value.trim();
          const password = document.getElementById("teacherPassword").value.trim();
          const accessCode = document.getElementById("accessCode").value.trim();
          const registerBtn = document.getElementById("registerBtn");

          if (!name || !password || !accessCode) {
            showError("⚠️ Please fill in all fields.");
            return;
          }

          // Hardcoded admin secret - easy to change or grab from database
          if (accessCode !== "ATTENDAI-ADMIN") {
            showError("⚠️ Invalid School Access Code. Registration blocked.");
            return;
          }

          registerBtn.disabled = true;
          registerBtn.textContent = "Creating Account...";

          // 1. Create auth user
          const email = name.toLowerCase().replace(/\s/g,'') + "@attendai.app";
          const { data: authData, error: authError } = await _supabase.auth.signUp({
            email: email,
            password: password
          });
          
          if (authError) {
            showError(authError.message);
            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";
            return;
          }

          // 2. Insert into teachers table
          // Generate a temp employee ID since it's on the teacher dashboard now
          const empId = "EMP-" + Math.floor(1000 + Math.random() * 9000);

          const { error: dbError } = await _supabase.from("teachers").insert({
            user_id: authData.user.id,
            name: name,
            employee_id: empId,
            subject: "",
            department: ""
          });

          if (dbError) {
            showError("Registration failed: " + dbError.message);
            registerBtn.disabled = false;
            registerBtn.textContent = "Create Account";
            return;
          }

          // ✅ FIX: Show success then redirect to login
          showSuccess("Account created! Redirecting to login...");
          setTimeout(function () {
            window.location.href = "index.html";
          }, 1500);
        }

        function showError(msg) {
          const el = document.getElementById("statusMsg");
          if (!el) return;
          el.textContent = msg;
          el.style.display = "block";
          el.style.color = "#ffb347";
          el.style.background = "rgba(255,179,71,0.08)";
        }

        function showSuccess(msg) {
          const el = document.getElementById("statusMsg");
          if (!el) return;
          el.textContent = msg;
          el.style.display = "block";
          el.style.color = "#22c55e";
          el.style.background = "rgba(34,197,94,0.08)";
        }

      </script>
    </div>
  </div>
  <script src="mist.js"></script>
</body>
</html>
